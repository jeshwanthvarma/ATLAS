<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ATLAS | Login</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- Logo -->

        <div class="logo">

            <h1>
                <i class="fa-solid fa-globe"></i>
                ATLAS
            </h1>

            <p>
                Infrastructure Monitoring Platform
            </p>

        </div>

        <!-- Error -->

        <div
            class="error-message"
            id="errorMessage">

        </div>

        <!-- Login Form -->

        <form id="loginForm">

            <!-- Email -->

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@atlas.com"
                    required>

            </div>

            <!-- Password -->

            <div class="form-group">

                <label>Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword">

                        <i
                            id="eyeIcon"
                            class="fa-solid fa-eye">
                        </i>

                    </button>

                </div>

            </div>

            <!-- Remember -->

            <div class="options">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe">

                    Remember Me

                </label>

                <a href="#"
                   id="forgotPassword">

                    Forgot Password?

                </a>

            </div>

            <!-- Login -->

            <button
                class="btn btn-primary"
                type="submit"
                id="loginBtn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Sign In

            </button>

            <!-- Loading -->

            <div
                class="loading"
                id="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                Signing In...

            </div>

        </form>

        <!-- Divider -->

        <div class="divider">

            <span>OR</span>

        </div>

        <!-- Google -->

        <button
            class="btn btn-google"
            id="googleLoginBtn">

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                width="22">

            Continue with Google

        </button>

        <!-- Footer -->

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

            <br><br>

            <small>

                Protected by Firebase Authentication

            </small>

        </div>

    </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
